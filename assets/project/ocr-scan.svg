<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="ocr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#182740"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="320" fill="url(#ocr-bg)"/>

  <!-- Top bar -->
  <rect x="40" y="24" width="520" height="32" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="58" cy="40" r="5" fill="#38bdf8"/>
  <text x="74" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">TESSERACT OCR + CNN // HANDWRITTEN FORM LOCALIZER</text>
  <rect x="450" y="29" width="100" height="22" rx="4" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1"/>
  <text x="466" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700">99.4% ACCURACY</text>

  <!-- Document Sheet Preview -->
  <g transform="translate(110, 75)">
    <rect width="380" height="165" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    
    <!-- Form title lines -->
    <rect x="25" y="18" width="130" height="8" rx="4" fill="#64748b"/>
    <line x1="25" y1="36" x2="355" y2="36" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Field 1 with OCR Box -->
    <rect x="25" y="52" width="60" height="6" rx="3" fill="#475569"/>
    <rect x="95" y="45" width="240" height="26" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="62" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">EXTRACTED: "Siddharth Ganjoo"</text>
    <rect x="300" y="48" width="30" height="18" rx="2" fill="#38bdf8"/>
    <text x="303" y="61" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8" font-weight="800">100%</text>

    <!-- Field 2 with OCR Box -->
    <rect x="25" y="92" width="60" height="6" rx="3" fill="#475569"/>
    <rect x="95" y="85" width="240" height="26" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5"/>
    <text x="105" y="102" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">EXTRACTED: "TU/e Supercomputing"</text>
    <rect x="300" y="88" width="30" height="18" rx="2" fill="#10b981"/>
    <text x="305" y="101" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8" font-weight="800">99%</text>

    <!-- Scan Beam Animation Line -->
    <line x1="25" y1="126" x2="355" y2="126" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- Bottom Metric Cards -->
  <g transform="translate(40, 260)">
    <rect width="160" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="14" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="600">RECOGNITION ENGINE</text>
    <text x="14" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="800">Custom CNN + OCR</text>

    <rect x="220" y="0" width="160" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="234" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="600">PROCESSING TYPE</text>
    <text x="234" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="800">Full Automated Pipeline</text>

    <rect x="400" y="0" width="160" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="414" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="600">DOCUMENT SPEED</text>
    <text x="414" y="32" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="800">&lt; 1.2s per Form</text>
  </g>
</svg>

