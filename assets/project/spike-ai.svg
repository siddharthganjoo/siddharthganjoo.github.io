<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="spike-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c24"/>
      <stop offset="50%" stop-color="#1e103d"/>
      <stop offset="100%" stop-color="#0a0517"/>
    </linearGradient>
    <linearGradient id="neuron-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="600" height="320" fill="url(#spike-bg)"/>

  <!-- Top bar -->
  <rect x="40" y="24" width="520" height="32" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="58" cy="40" r="5" fill="#a855f7"/>
  <text x="74" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">TU/e SUPERCOMPUTING // SPIKE AI NEUROMORPHIC ACCELERATOR</text>
  <rect x="450" y="29" width="100" height="22" rx="4" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1"/>
  <text x="466" y="44" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700">HPC NODE 01</text>

  <!-- Spiking Neural Graph -->
  <g stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5">
    <!-- Input layer to Hidden layer -->
    <line x1="120" y1="100" x2="260" y2="90"/>
    <line x1="120" y1="100" x2="260" y2="150"/>
    <line x1="120" y1="160" x2="260" y2="90"/>
    <line x1="120" y1="160" x2="260" y2="150"/>
    <line x1="120" y1="160" x2="260" y2="210"/>
    <line x1="120" y1="220" x2="260" y2="150"/>
    <line x1="120" y1="220" x2="260" y2="210"/>

    <!-- Hidden to Output layer -->
    <line x1="260" y1="90" x2="400" y2="120"/>
    <line x1="260" y1="150" x2="400" y2="120"/>
    <line x1="260" y1="150" x2="400" y2="190"/>
    <line x1="260" y1="210" x2="400" y2="190"/>

    <!-- Output to Spike Train -->
    <line x1="400" y1="120" x2="490" y2="120" stroke="#c084fc" stroke-width="2" stroke-dasharray="2,5"/>
    <line x1="400" y1="190" x2="490" y2="190" stroke="#c084fc" stroke-width="2" stroke-dasharray="2,5"/>
  </g>

  <!-- Neuron nodes -->
  <!-- Layer 1 -->
  <circle cx="120" cy="100" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
  <circle cx="120" cy="160" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
  <circle cx="120" cy="220" r="14" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>

  <!-- Layer 2 -->
  <circle cx="260" cy="90" r="16" fill="url(#neuron-grad)"/>
  <circle cx="260" cy="150" r="16" fill="#0f172a" stroke="#a855f7" stroke-width="2.5"/>
  <circle cx="260" cy="210" r="16" fill="url(#neuron-grad)"/>

  <!-- Layer 3 -->
  <circle cx="400" cy="120" r="18" fill="url(#neuron-grad)"/>
  <circle cx="400" cy="190" r="18" fill="#0f172a" stroke="#c084fc" stroke-width="2.5"/>

  <!-- Spike Train Graph (Right) -->
  <g transform="translate(490, 95)" stroke="#38bdf8" stroke-width="2">
    <!-- Spikes -->
    <line x1="10" y1="35" x2="10" y2="10"/>
    <line x1="22" y1="35" x2="22" y2="5"/>
    <line x1="38" y1="35" x2="38" y2="8"/>
    <line x1="50" y1="35" x2="50" y2="2"/>
    <line x1="68" y1="35" x2="68" y2="6"/>
    <line x1="0" y1="35" x2="80" y2="35" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="5" y="47" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="8">SNN SPIKES</text>
  </g>

  <!-- Bottom Metric Cards -->
  <g transform="translate(40, 260)">
    <rect width="160" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="14" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="600">PARADIGM</text>
    <text x="14" y="32" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="800">SPIKING NEURAL NETS</text>

    <rect x="220" y="0" width="160" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="234" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="600">INFRASTRUCTURE</text>
    <text x="234" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="800">TU/e SUPERCOMPUTER</text>

    <rect x="400" y="0" width="160" height="40" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="414" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="600">ENERGY EFFICIENCY</text>
    <text x="414" y="32" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="800">ULTRA-LOW POWER</text>
  </g>
</svg>

