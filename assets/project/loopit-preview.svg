<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0f1a36"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 102, 255, 0.2)"/>
      <stop offset="100%" stop-color="rgba(0, 210, 255, 0.05)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="320" fill="url(#bg-grad)"/>

  <!-- Tech Grid Background -->
  <g opacity="0.12" stroke="#00d2ff" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="60" y1="0" x2="60" y2="320"/>
    <line x1="140" y1="0" x2="140" y2="320"/>
    <line x1="220" y1="0" x2="220" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="380" y1="0" x2="380" y2="320"/>
    <line x1="460" y1="0" x2="460" y2="320"/>
    <line x1="540" y1="0" x2="540" y2="320"/>
  </g>

  <!-- HUD Top Bar -->
  <rect x="30" y="24" width="540" height="34" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="48" cy="41" r="5" fill="#00d2ff"/>
  <text x="62" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" letter-spacing="0.5">LOOPIT.AI // COMPUTER VISION INSPECTION ENGINE</text>
  <rect x="470" y="30" width="88" height="22" rx="4" fill="rgba(0, 210, 255, 0.15)" stroke="#00d2ff" stroke-width="1"/>
  <text x="480" y="45" fill="#00d2ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700">YOLOv8 DETECT</text>

  <!-- Stylized Vehicle Wireframe -->
  <g transform="translate(130, 95)" stroke="#00d2ff" stroke-width="2" fill="none" opacity="0.85">
    <!-- Car silhouette -->
    <path d="M 20 120 C 35 120 45 95 65 95 L 110 95 L 150 45 L 240 45 L 290 95 L 325 105 C 335 110 340 120 340 125 L 15 125 Z" stroke-dasharray="4,2"/>
    <!-- Wheels -->
    <circle cx="75" cy="125" r="22" stroke="#0066ff" stroke-width="3" fill="#091024"/>
    <circle cx="75" cy="125" r="8" fill="#00d2ff"/>
    <circle cx="275" cy="125" r="22" stroke="#0066ff" stroke-width="3" fill="#091024"/>
    <circle cx="275" cy="125" r="8" fill="#00d2ff"/>
    <!-- Windows -->
    <path d="M 120 90 L 155 52 L 235 52 L 275 90 Z" stroke="rgba(0, 210, 255, 0.4)" fill="rgba(0, 102, 255, 0.1)"/>
  </g>

  <!-- Bounding Box 1: Dent Damage -->
  <g transform="translate(145, 130)">
    <rect width="115" height="65" rx="4" fill="url(#box-grad)" stroke="#ff4757" stroke-width="1.8" stroke-dasharray="3,3"/>
    <rect x="-1" y="-18" width="92" height="18" rx="3" fill="#ff4757"/>
    <text x="5" y="-5" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="700">DENT [0.94]</text>
    <!-- Crosshairs -->
    <line x1="57" y1="26" x2="57" y2="38" stroke="#ff4757" stroke-width="1.5"/>
    <line x1="51" y1="32" x2="63" y2="32" stroke="#ff4757" stroke-width="1.5"/>
  </g>

  <!-- Bounding Box 2: Scratch Damage -->
  <g transform="translate(325, 145)">
    <rect width="130" height="50" rx="4" fill="url(#box-grad)" stroke="#ffa502" stroke-width="1.8"/>
    <rect x="-1" y="-18" width="105" height="18" rx="3" fill="#ffa502"/>
    <text x="5" y="-5" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="700">SCRATCH [0.89]</text>
  </g>

  <!-- Bottom Telemetry HUD -->
  <g transform="translate(30, 260)">
    <rect width="165" height="38" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="14" y="16" fill="#8892b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="600">INSPECTION TIME</text>
    <text x="14" y="31" fill="#00d2ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="800">42ms / frame</text>

    <rect x="210" y="0" width="165" height="38" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="224" y="16" fill="#8892b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="600">SEVERITY INDEX</text>
    <text x="224" y="31" fill="#2ed573" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="800">Moderate (Class B)</text>

    <rect x="390" y="0" width="180" height="38" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="404" y="16" fill="#8892b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="600">ESTIMATED REPAIR</text>
    <text x="404" y="31" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="800">€480 – €560 EUR</text>
  </g>
</svg>
