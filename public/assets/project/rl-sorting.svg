<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="rl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1914"/>
      <stop offset="50%" stop-color="#0f291e"/>
      <stop offset="100%" stop-color="#08140f"/>
    </linearGradient>
    <linearGradient id="rl-line" x1="0%" y1="0%" x2="100%" y2="0%">
