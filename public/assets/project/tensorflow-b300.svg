<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="tfb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#1d1d1f"/>
    </linearGradient>
    <linearGradient id="tfb-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8f00"/>
      <stop offset="1" stop-color="#76b900"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#tfb-bg)"/>

  <!-- GPU board -->
  <g transform="translate(150 96)">
    <rect width="340" height="150" rx="18" fill="#2c2c2e" stroke="rgba(255,255,255,0.12)"/>
    <rect x="24" y="24" width="102" height="102" rx="12" fill="#1c1c1e" stroke="url(#tfb-glow)" stroke-width="2"/>
    <text x="75" y="84" text-anchor="middle" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5">B300</text>
    <g fill="#3a3a3c">
      <rect x="150" y="28" width="166" height="14" rx="7"/>
      <rect x="150" y="54" width="132" height="14" rx="7"/>
      <rect x="150" y="80" width="150" height="14" rx="7"/>
      <rect x="150" y="106" width="104" height="14" rx="7"/>
    </g>
    <rect x="150" y="28" width="166" height="14" rx="7" fill="url(#tfb-glow)" opacity="0.9"/>
  </g>

  <text x="320" y="300" text-anchor="middle" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.4">TensorFlow, running on Blackwell Ultra</text>
  <text x="320" y="62" text-anchor="middle" fill="#98989d" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15">&gt;&gt;&gt; tf.config.list_physical_devices('GPU')</text>
</svg>
